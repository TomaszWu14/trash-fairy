<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1222">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05070F">
  <meta name="description" content="Zgłoś pełny kosz w Krakowie jednym dotknięciem. Dyspozytor MPO widzi zgłoszenie od razu.">
  <title>Zgłoś kosz — {{ point.name }} · Trash Fairy</title>
  <link rel="manifest" href="{{ url_for('static', filename='zglos/manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='zglos/icon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='zglos/zglos.css') }}">
</head>
<body>
<header class="z-head">
  <div class="z-brand">
    <span class="z-logo">Trash <span>Fairy</span><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="#CDBBFF"/></svg></span>
    <span class="z-sub"><span class="z-sub-phone">MPO Kraków · zgłoś stan kosza</span><span class="z-sub-wide">Kraków nie potrzebuje więcej koszy, potrzebuje wróżki.</span></span>
  </div>
  <span class="z-demo" role="status">Demo · {{ clock_label }}</span>
</header>

<div class="z-body">
  <div class="z-mapwrap">
    <div id="map" class="z-map" role="img" aria-label="Mapa: {{ point.name }} i kosze w okolicy"></div>
    <span class="z-dist" id="dist" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B5FD6" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span id="dist-txt"></span></span>
  </div>

  <div class="z-col">
    <section class="z-card" aria-label="Kosz">
      <h1 id="p-name">{{ point.name }}</h1>
      <span class="z-muted" id="p-addr">…</span>
      <div class="z-status" id="p-status">
        <span>Szacujemy <strong id="p-fill">–</strong>. Odbiór planowo <strong id="p-eta">–</strong>.</span>
        <span class="z-track"><span class="z-fill" id="p-bar" style="width:0%"></span></span>
      </div>
    </section>

    <div class="z-spacer"></div>

    <section class="z-sheet" aria-label="Zgłoszenie" id="sheet" aria-live="polite">
      {# treść rysuje zglos.js: stany start / sending / sent / dup / offline / far / limit / error / nosignal #}
    </section>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  window.ZGLOS = { pointId: {{ point.id }}, name: {{ point.name|tojson }}, jury: {{ (request.args.get('jury') == '1')|tojson }},
                   basemap: {{ url_for('static', filename='img/krakow-basemap.svg')|tojson }},
                   sw: "/zglos/sw.js" };
</script>
<script src="{{ url_for('static', filename='zglos/queue.js') }}"></script>
<script src="{{ url_for('static', filename='zglos/zglos.js') }}"></script>
</body>
</html>

# Aktualizacje zależności: co tydzień, drobne wersje (minor/patch) zgrupowane w jeden PR na ekosystem.
# Gałęzie dependabot/** nie scalają się same – PR przechodzi CI (ci.yml, on: pull_request) i czeka na przegląd.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

name: Monitor demo

# Co 6 godzin sprawdza publiczne demo: strona główna odpowiada 200, a /health zwraca 200
# i {"status": "ok"} (sprawdza też bazę). Awaria → jedno issue „Demo nie odpowiada” z etykietą
# `demo` (kolejne awarie dopisują komentarze); po udanym sprawdzeniu issue jest zamykane.
on:
  schedule:
    - cron: '17 */6 * * *'   # co 6 h, poza pełną godziną (mniej opóźnień w GitHub)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: demo-monitor
  cancel-in-progress: false

env:
  DEMO_URL: https://trashfairy.twapp.pl
  LABEL: demo

jobs:
  check:
    name: Demo odpowiada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sprawdź demo
        id: check
        shell: bash
        run: |
          set -uo pipefail
          problems=()
          get() { curl -sS --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors "$@"; }

          code=$(get -o /dev/null -w '%{http_code}' "$DEMO_URL/") || code=${code:-000}
          [ "$code" = 200 ] || problems+=("Strona główna $DEMO_URL/ zwraca kod $code (oczekiwany 200)")

          health=$(get -w '\n%{http_code}' "$DEMO_URL/health") || health=$'\n000'
          hcode=$(tail -n1 <<<"$health"); hbody=$(sed '$d' <<<"$health")
          if [ "$hcode" != 200 ] || [ "$(jq -r '.status // empty' <<<"$hbody" 2>/dev/null)" != ok ]; then
            problems+=("/health zwraca kod $hcode: ${hbody:0:200}")
          fi

          if [ ${#problems[@]} -eq 0 ]; then
            echo "Demo działa." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "Demo $DEMO_URL — problemy ($(date -u '+%Y-%m-%d %H:%M UTC')):"
              for p in "${problems[@]}"; do echo "- $p"; done
              echo
              echo "Przebieg: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > report.md
            tee -a "$GITHUB_STEP_SUMMARY" < report.md
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Zgłoś awarię (issue)
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          # push ntfy (opcjonalny: bez sekretu NTFY_URL pomijamy; nigdy nie psuje przebiegu)
          ntfy() {
            case "${NTFY_URL:-}" in https://*) ;; *) echo "NTFY_URL nie ustawiony lub nie https — pomijam push"; return 0;; esac
            curl -fsS --max-time 10 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -d "$4" "$NTFY_URL" || true
          }
          gh label create "$LABEL" --color B60205 --description "Automatyczny monitor demo" 2>/dev/null || true
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file report.md
          else
            gh issue create --title "Demo nie odpowiada" --label "$LABEL" --body-file report.md
            ntfy "Demo nie odpowiada: trash-fairy" high warning "Demo przestało odpowiadać. Szczegóły: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit 1   # czerwony przebieg = mail z GitHub do właściciela repozytorium

      - name: Zamknij zgłoszenie po naprawie
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          # push ntfy (opcjonalny: bez sekretu NTFY_URL pomijamy; nigdy nie psuje przebiegu)
          ntfy() {
            case "${NTFY_URL:-}" in https://*) ;; *) echo "NTFY_URL nie ustawiony lub nie https — pomijam push"; return 0;; esac
            curl -fsS --max-time 10 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -d "$4" "$NTFY_URL" || true
          }
          for n in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Demo znów odpowiada ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            recovered=1
          done
          if [ -n "${recovered:-}" ]; then
            ntfy "Demo znowu odpowiada: trash-fairy" low white_check_mark "Demo znowu odpowiada. Przebieg: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

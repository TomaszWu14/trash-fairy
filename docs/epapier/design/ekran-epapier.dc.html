<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>E-papier · ekran kosza 800×480</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 800px; height: 480px; overflow: hidden; background: #FFFFFF; color: #000000; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 500; font-variant-numeric: tabular-nums; box-sizing: border-box">

<header style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 24px; border-bottom: 3px solid #000000; box-sizing: border-box">
<span style="display: flex; align-items: center; gap: 8px; font-size: 22px; line-height: 28px; font-weight: 700">MPO Kraków · Trash Fairy<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1 L14.5 9.5 L23 12 L14.5 14.5 L12 23 L9.5 14.5 L1 12 L9.5 9.5 Z" fill="#000000"></path></svg></span>
<span style="font-size: 22px; line-height: 28px; font-weight: 500">Kosz Rynek 03 · nr 1183</span>
</header>

<sc-if value="{{isDay}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; height: 280px">
<div style="width: 584px; flex: none; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; background: {{bandBg}}; color: {{bandFg}}">
<div style="display: flex; align-items: center; gap: 20px">
<svg width="88" height="88" viewBox="0 0 40 40" style="flex: none" aria-hidden="true">
<sc-if value="{{icOk}}" hint-placeholder-val="{{ true }}"><circle cx="20" cy="20" r="19" fill="{{icFill}}"></circle><path d="M11 20.5l6 6 12-13" fill="none" stroke="{{icGlyph}}" stroke-width="4.5" stroke-linecap="square"></path></sc-if>
<sc-if value="{{icReport}}" hint-placeholder-val="{{ false }}"><path d="M2 6a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H14l-12 9V6z" fill="{{icFill}}"></path><rect x="9" y="14" width="5" height="5" fill="{{icGlyph}}"></rect><rect x="17.5" y="14" width="5" height="5" fill="{{icGlyph}}"></rect><rect x="26" y="14" width="5" height="5" fill="{{icGlyph}}"></rect></sc-if>
<sc-if value="{{icFull}}" hint-placeholder-val="{{ false }}"><rect x="1" y="1" width="38" height="38" fill="{{icFill}}"></rect><rect x="17" y="7" width="6" height="17" fill="{{icGlyph}}"></rect><rect x="17" y="28" width="6" height="6" fill="{{icGlyph}}"></rect></sc-if>
<sc-if value="{{icWarn}}" hint-placeholder-val="{{ false }}"><path d="M20 1 L39 38 H1 Z" fill="{{icFill}}"></path><rect x="17.5" y="13" width="5" height="13" fill="{{icGlyph}}"></rect><rect x="17.5" y="29" width="5" height="5" fill="{{icGlyph}}"></rect></sc-if>
</svg>
<span style="font-size: 56px; line-height: 60px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em">{{head}}</span>
</div>
<span style="font-size: 32px; line-height: 38px; font-weight: 700">{{big}}</span>
<span style="font-size: 24px; line-height: 30px; font-weight: 500">{{sub}}</span>
</div>
<div style="flex: 1; border-left: 3px solid #000000; padding: 20px 20px 0 21px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="width: 168px; height: 168px; padding: 8px; box-sizing: border-box; background: #FFFFFF; outline: 3px solid #000000; outline-offset: 0; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr))">
<sc-for list="{{qr}}" as="q" hint-placeholder-count="25"><span style="background: {{q.c}}"></span></sc-for>
</div>
<span style="font-size: 20px; line-height: 24px; font-weight: 500">{{qrCap}}</span>
</div>
</div>

<div style="position: absolute; left: 24px; right: 24px; top: 344px; height: 88px; border: 3px solid #000000; box-sizing: border-box; display: flex">
<div style="width: 340px; flex: none; padding: 8px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 20px; line-height: 24px">{{fillLbl}}</span>
<span style="display: flex; align-items: center; gap: 12px">
<span style="display: flex; gap: 4px">
<sc-for list="{{blocks}}" as="b" hint-placeholder-count="10"><span style="width: 18px; height: 34px; box-sizing: border-box; border: 3px solid #000000; background: {{b.c}}"></span></sc-for>
</span>
<span style="font-size: 28px; line-height: 34px; font-weight: 700">{{fillTxt}}</span>
</span>
</div>
<div style="flex: 1; border-left: 3px solid #000000; padding: 8px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 20px; line-height: 24px">{{bLbl}}</span>
<span style="font-size: 30px; line-height: 38px; font-weight: 700; white-space: nowrap">{{bVal}}</span>
</div>
<div style="flex: 1; border-left: 3px solid #000000; padding: 8px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 20px; line-height: 24px">{{cLbl}}</span>
<span style="font-size: 30px; line-height: 38px; font-weight: 700; white-space: nowrap">{{cVal}}</span>
</div>
</div>
</sc-if>

<sc-if value="{{isNight}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; height: 368px">
<div style="flex: 1; padding: 32px 24px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 24px">
<div style="display: flex; align-items: center; gap: 24px">
<svg width="96" height="96" viewBox="0 0 40 40" style="flex: none" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#000000"></circle><path d="M11 20.5l6 6 12-13" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="square"></path></svg>
<span style="font-size: 60px; line-height: 64px; font-weight: 700; text-transform: uppercase">W porządku</span>
</div>
<span style="font-size: 48px; line-height: 56px; font-weight: 700">Odbiór jutro 06:00</span>
</div>
<div style="width: 216px; flex: none; border-left: 3px solid #000000; padding: 32px 20px 0 21px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="width: 168px; height: 168px; padding: 8px; box-sizing: border-box; background: #FFFFFF; outline: 3px solid #000000; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr))">
<sc-for list="{{qr}}" as="q" hint-placeholder-count="25"><span style="background: {{q.c}}"></span></sc-for>
</div>
<span style="font-size: 20px; line-height: 24px">Pełny? Zeskanuj albo naciśnij przycisk.</span>
</div>
</div>
</sc-if>

<footer style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 24px; box-sizing: border-box; font-size: 16px; line-height: 20px; font-weight: 500">
<span>Rynek Główny 3, róg Szewskiej</span>
<span>{{foot}}</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["calm","confirm","enroute","emptied","overflow","fault","night"],"default":"calm"},"tri":{"editor":"boolean","default":false},"$preview":{"width":800,"height":480}}'>
const RED='#C4161C';
const S={
 calm:{ic:'ok',head:'W porządku',big:'Kosz nie wymaga zgłoszenia',sub:'Kurs: kosze uliczne. Planowy odbiór i zapełnienie poniżej.',qrCap:'Pełny? Zeskanuj albo naciśnij przycisk.',fill:6,fillTxt:'62 %',bLbl:'Następny odbiór',bVal:'ok. 14:00',cLbl:'Zgłoszenia',cVal:'brak',seed:11},
 confirm:{ic:'report',head:'Zgłoszono',big:'Zgłoszenie przyjęte o 13:24',sub:'Dyspozytor już wie. Dziękujemy. Czas przyjazdu ekipy poniżej.',qrCap:'Zeskanuj, aby śledzić status tego kosza.',fill:6,fillTxt:'62 %',bLbl:'Ekipa',bVal:'ok. 14:00',cLbl:'Zgłosiły',cVal:'2 osoby',seed:23,invert:true},
 enroute:{ic:'report',head:'Ekipa w drodze',big:'Ten kosz jest na trasie',sub:'Przystanek i czas przyjazdu poniżej.',qrCap:'Zeskanuj, aby śledzić status tego kosza.',fill:6,fillTxt:'62 %',bLbl:'Przyjazd',bVal:'ok. 12 min',cLbl:'Przystanek',cVal:'34 z 53',seed:23},
 emptied:{ic:'ok',head:'Opróżniono',big:'14:02 · dziękujemy',sub:'Następny odbiór jutro 06:00. Zarejestrowani dostają +10 pkt.',qrCap:'Przyjaciele Wróżki: zeskanuj, aby dołączyć.',fill:0,fillTxt:'0 %',bLbl:'Następny odbiór',bVal:'jutro 06:00',cLbl:'Zgłoszenia',cVal:'zamknięte',seed:37},
 overflow:{ic:'full',head:'Przepełniony',big:'Zgłoszenie przyjęte 13:24',sub:'Trwa wydarzenie, kosz zapełnia się szybciej. Czas odbioru może się wydłużyć.',qrCap:'Zeskanuj, aby śledzić status tego kosza.',fill:10,fillTxt:'100 %',bLbl:'Odbiór planowo',bVal:'ok. 14:00',cLbl:'Zgłosiły',cVal:'2 osoby',seed:23},
 fault:{ic:'warn',head:'Usterka',big:'Przycisk może nie działać',sub:'Brak sygnału od 48 h, bateria 12 %. Zgłoszenie przez QR działa.',qrCap:'Zeskanuj, aby zgłosić stan kosza telefonem.',fill:-1,fillTxt:'—',fillLbl:'Zapełnienie: brak danych',bLbl:'Serwis',bVal:'za 2 dni rob.',cLbl:'Bateria',cVal:'12 %',seed:11,foot:'Bateria 12 % · ostatni sygnał 01.10, 13:20'},
 night:{ic:'ok',seed:11,foot:'Tryb oszczędny · odświeżanie co godzinę'}
};
function qrCells(seed){
 const N=25,cells=[];let s=seed*7919+1;
 const F=[[0,0],[0,18],[18,0]];
 const fin=(r,c)=>{for(const [R,C] of F){if(r>=R&&r<R+7&&c>=C&&c<C+7){const a=r-R,b=c-C;return (a===0||a===6||b===0||b===6||(a>=2&&a<=4&&b>=2&&b<=4))?1:0;}}return -1;};
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){let f=fin(r,c);if(f<0){if((r<8&&c<8)||(r<8&&c>16)||(r>16&&c<8))f=0;else if(r===6||c===6)f=(r+c)%2===0?1:0;else{s=(s*1103515245+12345)%2147483648;f=(s>>16)&1;}}cells.push({c:f?'#000000':'#FFFFFF'});}
 return cells;
}
class Component extends DCLogic {
 renderVals(){
  const st=this.props.state||'calm';
  const d=S[st]||S.calm;
  const tri=!!this.props.tri;
  const inv=!!d.invert;
  const bandBg=inv?(tri?RED:'#000000'):'#FFFFFF';
  const bandFg=inv?'#FFFFFF':'#000000';
  const blocks=[];for(let i=0;i<10;i++)blocks.push({c:d.fill<0?'#FFFFFF':(i<d.fill?'#000000':'#FFFFFF')});
  return Object.assign({},d,{
   isDay:st!=='night',isNight:st==='night',
   bandBg,bandFg,
   icFill:inv?'#FFFFFF':'#000000',icGlyph:inv?(tri?RED:'#000000'):'#FFFFFF',
   icOk:d.ic==='ok',icReport:d.ic==='report',icFull:d.ic==='full',icWarn:d.ic==='warn',
   blocks,qr:qrCells(d.seed),
   foot:d.foot||'Bateria 78 % · ostatni sygnał 13:20',
   fillLbl:d.fillLbl||'Szacowane zapełnienie'
  });
 }
}
</script>
</body>
</html>
